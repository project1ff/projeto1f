<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Saúde Mental nas Redes Sociais</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #121212; /* Fundo escuro neutro */
      color: #e0e0e0; /* Texto claro */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
    }

    /* O container principal que prende o scroll */
    .app-container {
      width: 100%;
      max-width: 500px; /* Um pouco mais largo para dar destaque */
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow-y: scroll;
      scroll-snap-type: y mandatory; /* Trava a rolagem vertical */
      scrollbar-width: none;
      background: #000;
    }

    .app-container::-webkit-scrollbar {
      display: none;
    }

    /* Cada "página" do feed */
    .post {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start; /* Alinha cada post ao topo */
      scroll-snap-stop: always; /* Impede passar direto */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* O fundo desfocado atrás da imagem principal */
    .slide-bg-blur {
      position: absolute;
      inset: -30px; /* Expande para fora do post */
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.4) saturate(1.8); /* Efeito de blur dramático */
      transform: scale(1.2); /* Aumenta o fundo */
      z-index: 1;
      pointer-events: none;
      opacity: 0.8;
    }

    /* A imagem principal */
    .post > img {
      position: relative;
      width: 90%; /* Menor que 100% para dar respiro */
      height: 90%; /* Menor que 100% para dar respiro */
      object-fit: contain; /* Mantém a proporção da imagem */
      z-index: 2;
      pointer-events: none;
      border-radius: 12px; /* Bordas arredondadas na imagem */
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* A caixa de texto/legenda */
    .post-info {
      position: absolute;
      bottom: 30px;
      left: 30px;
      right: 30px;
      z-index: 10;
      background: rgba(30, 30, 30, 0.7); /* Fundo semi-transparente */
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px); /* Efeito de vidro na legenda */
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .caption {
      font-size: 16px;
      line-height: 1.5;
      color: #f5f5f5;
      font-weight: 400;
      text-align: center;
    }

    /* Destaque visual na primeira página */
    #post_1 .caption {
      font-size: 22px;
      font-weight: 700;
      color: #2196f3; /* Azul vibrante para título */
    }

  </style>
</head>
<body>

  <div class="app-container" id="feed">

    <!-- CAPA - INTRODUÇÃO -->
    <div class="post" data-id="post_1" id="post_1">
      <!-- Coloque a imagem da capa aqui -->
      <img src="sua-foto-capa.jpg" alt="Saúde Mental nas Redes Sociais" />
      
      <div class="post-info">
        <div class="caption">
          Saúde Mental <br>nas Redes Sociais
          <p style="font-size: 14px; color: #aaa; font-weight: 400; margin-top: 10px;">Um trabalho sobre os impactos da vida digital.</p>
        </div>
      </div>
      <!-- Div de background blur gerada automaticamente pelo JS abaixo -->
      <div class="slide-bg-blur"></div>
    </div>

    <!-- POST 2 -->
    <div class="post" data-id="post_2">
      <!-- Coloque sua segunda imagem aqui -->
      <img src="sua-foto-1.jpg" alt="Impactos" />
      
      <div class="post-info">
        <div class="caption">
          O mito da perfeição. <br>
          <span style="font-weight: 600; font-size: 18px;">Não se compare com o destaque de alguém.</span>
        </div>
      </div>
      <div class="slide-bg-blur"></div>
    </div>

    <!-- POST 3 -->
    <div class="post" data-id="post_3">
      <!-- Coloque sua terceira imagem aqui -->
      <img src="sua-foto-2.jpg" alt="Dicas" />
      
      <div class="post-info">
        <div class="caption">
          Tome o controle do seu feed! <br>
          <span style="font-weight: 600; font-size: 18px;">Siga perfis que te inspiram, não que te diminuem.</span>
        </div>
      </div>
      <div class="slide-bg-blur"></div>
    </div>
    
    <!-- POST 4 -->
    <div class="post" data-id="post_4">
      <!-- Coloque sua quarta imagem aqui -->
      <img src="sua-foto-3.jpg" alt="Conclusão" />
      
      <div class="post-info">
        <div class="caption">
          Desconecte-se. <br>
          <span style="font-weight: 600; font-size: 18px;">Sua saúde mental vale mais que likes.</span>
        </div>
      </div>
      <div class="slide-bg-blur"></div>
    </div>

  </div>

  <script>
    // Script para gerar o fundo desfocado automaticamente com base na imagem principal
    function initAmbientBackgrounds() {
      document.querySelectorAll('.post').forEach(post => {
        const img = post.querySelector('img');
        const bg = post.querySelector('.slide-bg-blur');
        
        if (img && bg) {
          const applyBg = () => {
            // Pega o caminho da imagem original
            bg.style.backgroundImage = `url("${img.src}")`;
          };
          
          // Aplica assim que a imagem carregar
          if (img.complete) {
            applyBg();
          } else {
            img.addEventListener('load', applyBg);
          }
        }
      });
    }
    initAmbientBackgrounds();
  </script>

</body>
</html>
