<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reels Feed - Saúde Mental</title>
  
  <script src="https://unpkg.com/feather-icons"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none; 
    }
    
    body { 
      background-color: #000; 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      /* Removido o position: fixed que estava a bugar o telemóvel */
      display: flex;
      justify-content: center;
      margin: 0;
    }
    
    .app-container { 
      width: 100%; 
      max-width: 450px; 
      /* Usa dvh (dynamic viewport height) para lidar perfeitamente com a barra do telemóvel */
      height: 100vh;
      height: 100dvh; 
      background: #000; 
      overflow-y: scroll; 
      scroll-snap-type: y mandatory; 
      -webkit-overflow-scrolling: touch; 
      scrollbar-width: none; 
    }
    
    .app-container::-webkit-scrollbar { display: none; }
    
    .post { 
      position: relative; 
      width: 100%; 
      height: 100vh;
      height: 100dvh; 
      scroll-snap-align: start; 
      scroll-snap-stop: always; 
      overflow: hidden; 
      background: #111; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    
    .post > img { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      object-fit: contain; /* Mantém a foto sem cortes */
      z-index: 1; 
    }
    
    .overlay-bottom { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 220px; 
      background: linear-gradient(to top, rgba(0,0,0,0.9) 15%, transparent); 
      pointer-events: none; 
      z-index: 2; 
    }
    
    .actions-sidebar { 
      position: absolute; 
      right: 12px; 
      bottom: 90px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 16px; 
      z-index: 10; 
    }
    
    .action-btn { background: none; border: none; color: #fff; cursor: pointer; }
    .action-btn svg { width: 28px; height: 28px; filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.7)); }
    
    .post-info { 
      position: absolute; 
      bottom: 35px; 
      left: 14px; 
      right: 75px; 
      z-index: 10; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #fff; object-fit: cover;}
    .username { font-weight: 700; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .caption { font-size: 13px; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

  <div class="app-container" id="feed">

    <div class="post" data-id="post_1">
      <img src="sua-foto-capa.jpg" alt="Capa" />
      <div class="overlay-bottom"></div>
      <div class="post-info">
        <div class="user-profile">
          <img class="avatar" src="sua-foto-capa.jpg" />
          <span class="username">@saude_mental_digital</span>
        </div>
        <div class="caption">O peso da vida digital. Arraste para baixo para ver o impacto! 👇</div>
      </div>
      <div class="actions-sidebar">
        <button class="action-btn"><i data-feather="heart"></i></button>
        <button class="action-btn"><i data-feather="message-circle"></i></button>
      </div>
    </div>

    <div class="post" data-id="post_2">
      <img src="sua-foto-1.jpg" alt="Post 1" />
      <div class="overlay-bottom"></div>
      <div class="post-info">
        <div class="user-profile">
          <img class="avatar" src="sua-foto-capa.jpg" />
          <span class="username">@saude_mental_digital</span>
        </div>
        <div class="caption">O mito da perfeição: não se compare com os destaques dos outros.</div>
      </div>
      <div class="actions-sidebar">
        <button class="action-btn"><i data-feather="heart"></i></button>
        <button class="action-btn"><i data-feather="message-circle"></i></button>
      </div>
    </div>

    <div class="post" data-id="post_3">
      <img src="sua-foto-2.jpg" alt="Post 2" />
      <div class="overlay-bottom"></div>
      <div class="post-info">
        <div class="user-profile">
          <img class="avatar" src="sua-foto-capa.jpg" />
          <span class="username">@saude_mental_digital</span>
        </div>
        <div class="caption">Tome o controle do seu feed! Siga conteúdos que te inspiram.</div>
      </div>
      <div class="actions-sidebar">
        <button class="action-btn"><i data-feather="heart"></i></button>
        <button class="action-btn"><i data-feather="message-circle"></i></button>
      </div>
    </div>

  </div>

  <script>
    feather.replace();
  </script>
</body>
</html>
