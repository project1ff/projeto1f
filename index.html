<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reels Feed - Saúde Mental</title>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none; 
    }
    
    body { 
      background-color: #000; 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      display: flex;
      justify-content: center;
      margin: 0;
    }
    
    .app-container { 
      width: 100%; 
      max-width: 450px; 
      height: 100vh;
      height: 100dvh; 
      background: #000; 
      overflow-y: scroll; 
      scroll-snap-type: y mandatory; 
      -webkit-overflow-scrolling: touch; 
      scrollbar-width: none; 
    }
    .app-container::-webkit-scrollbar { display: none; }
    
    .post { 
      position: relative; 
      width: 100%; 
      height: 100vh;
      height: 100dvh; 
      scroll-snap-align: start; 
      scroll-snap-stop: always; 
      overflow: hidden; 
      background: #111; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    
    .post > img { 
      position: absolute; 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      z-index: 1; 
    }
    
    .overlay-bottom { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 220px; 
      background: linear-gradient(to top, rgba(0,0,0,0.9) 15%, transparent); 
      pointer-events: none; 
      z-index: 2; 
    }
    
    .actions-sidebar { 
      position: absolute; 
      right: 12px; 
      bottom: 90px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 16px; 
      z-index: 10; 
    }
    
    .action-btn { 
      background: none; 
      border: none; 
      color: #fff; 
      cursor: pointer; 
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.2s;
    }
    .action-btn:active { transform: scale(1.2); }
    .action-btn svg { filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.7)); transition: all 0.2s; }
    .action-count { font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
    
    /* Cor do coração quando curtido */
    .like-btn.liked svg {
      fill: #ff2a54;
      stroke: #ff2a54;
    }
    
    .post-info { 
      position: absolute; 
      bottom: 35px; 
      left: 14px; 
      right: 75px; 
      z-index: 10; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #fff; object-fit: cover;}
    .username { font-weight: 700; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .caption { font-size: 13px; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    /* CSS DA GAVETA DE COMENTÁRIOS */
    .comments-drawer {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100;
      display: none;
      justify-content: center;
    }
    .comments-drawer.open { display: flex; }
    
    .drawer-backdrop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
    }
    
    .drawer-content {
      position: absolute;
      bottom: 0;
      width: 100%;
      max-width: 450px;
      height: 60%;
      background: #1e1e1e;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }
    
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    
    .drawer-header {
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #333;
      position: relative;
    }
    .close-drawer {
      position: absolute;
      right: 15px; top: 15px;
      background: none; border: none; color: #fff;
      font-size: 20px; cursor: pointer;
    }
    
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .comment-item {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .comment-item .avatar { width: 28px; height: 28px; }
    .comment-item-text { font-size: 14px; }
    .comment-item-text strong { color: #aaa; margin-right: 5px; }

    .drawer-footer {
      padding: 15px;
      background: #141414;
      border-top: 1px solid #333;
    }
    
    .chips-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar { display: none; }
    
    .chip-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-btn:active { background: #555; }
  </style>
</head>
<body>

  <div class="app-container" id="feed">

    <!-- POST 1 -->
    <div class="post" data-id="post_1">
      <img src="sua-foto-capa.jpg" alt="Capa" />
      <div class="overlay-bottom"></div>
      <div class="post-info">
        <div class="user-profile">
          <img class="avatar" src="sua-foto-capa.jpg" />
          <span class="username">@saude_mental_digital</span>
        </div>
        <div class="caption">O peso da vida digital. Arraste para baixo para ver o impacto!
