<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reels Carousel Feed</title>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Firebase Compat SDKs (Works directly in GitHub Pages) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background: #000;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .app-container::-webkit-scrollbar {
      display: none;
    }

    .post {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #000;
    }

    .carousel {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      position: relative;
      scroll-snap-align: start;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .slide-bg-blur {
      position: absolute;
      inset: -30px;
      background-size: cover;
      background-position: center;
      filter: blur(35px) brightness(0.65) saturate(1.4);
      transform: scale(1.15);
      z-index: 1;
      pointer-events: none;
    }

    .carousel-slide > img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }

    .overlay-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      pointer-events: none;
      z-index: 3;
    }

    .overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0.4) 60%, transparent);
      pointer-events: none;
      z-index: 3;
    }

    .actions-sidebar {
      position: absolute;
      right: 12px;
      bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }

    .action-btn {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      gap: 4px;
    }

    .action-btn svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.7));
      transition: transform 0.15s ease, fill 0.15s ease;
    }

    .action-btn:active svg {
      transform: scale(1.2);
    }

    .action-btn.liked svg {
      fill: #ff2a54;
      stroke: #ff2a54;
    }

    .action-btn.saved svg {
      fill: #fff;
    }

    .action-count {
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .post-info {
      position: absolute;
      bottom: 25px;
      left: 14px;
      right: 75px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      object-fit: cover;
    }

    .username {
      font-weight: 700;
      font-size: 14px;
    }

    .caption {
      font-size: 13px;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .pop-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      color: #ff2a54;
      fill: #ff2a54;
      pointer-events: none;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
    }

    .pop-heart.animate {
      transform: translate(-50%, -50%) scale(2.5);
      opacity: 1;
    }

    /* Comments Drawer */
    .comments-drawer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: none;
    }

    .comments-drawer.open {
      display: block;
    }

    .comments-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(2px);
    }

    .comments-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65%;
      background: #1e1e1e;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s ease-out;
      z-index: 101;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-header {
      padding: 14px 18px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-title {
      font-size: 14px;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }

    .comment-item strong {
      color: #fff;
      display: block;
      margin-bottom: 2px;
    }

    .comment-text {
      color: #ddd;
    }

    .empty-state {
      text-align: center;
      color: #888;
      margin-top: 40px;
      font-size: 13px;
    }

    .sheet-footer {
      padding: 12px 16px;
      border-top: 1px solid #333;
      background: #181818;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-indicator {
      font-size: 11px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .change-name-link {
      color: #0095f6;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
    }

    .chips-label {
      font-size: 12px;
      font-weight: 600;
      color: #bbb;
    }

    .premade-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s;
    }

    .chip-btn:active {
      transform: scale(0.95);
      background: #3a3a3a;
    }

    /* Name Input Modal */
    .name-modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .name-modal-overlay.open {
      display: flex;
    }

    .name-box {
      background: #242424;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .name-box h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .name-box p {
      font-size: 12px;
      color: #aaa;
      line-height: 1.4;
    }

    .name-box input {
      background: #151515;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .name-box input:focus {
      border-color: #0095f6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .modal-actions button {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: none;
    }

    .btn-cancel {
      background: transparent;
      color: #aaa;
    }

    .btn-confirm {
      background: #0095f6;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container" id="feed">

    <!-- POST 1 -->
    <div class="post" data-id="post_1">
      <div class="overlay-top"></div>
      <div class="overlay-bottom"></div>

      <div class="carousel">
        <div class="carousel-slide">
          <img src="imagy.jpg" alt="Foto 1" />
        </div>
      </div>

      <div class="post-info">
        <div class="user-profile">
          <img class="avatar" src="imagy.jpg" />
          <span class="username">@meu_perfil</span>
        </div>
        <div class="caption">Minha primeira foto ✨</div>
      </div>

      <div class="actions-sidebar">
        <button class="action-btn like-btn">
          <i data-feather="heart"></i>
          <span class="action-count">0</span>
        </button>
        <button class="action-btn comment-btn">
          <i data-feather="message-circle"></i>
          <span class="action-count comment-count">0</span>
        </button>
        <button class="action-btn bookmark-btn">
          <i data-feather="bookmark"></i>
          <span class="action-count">0</span>
        </button>
      </div>

      <i data-feather="heart" class="pop-heart"></i>
    </div>

    <!-- POST 2 -->
    <div class="post" data-id="post_2">
      <div class="overlay-top"></div>
      <div class="overlay-bottom"></div>

      <div class="carousel">
        <div class="carousel-slide">
          <img src="67.jpg" alt="Foto 2" />
        </div>
      </div>

      <div class="post-info">
        <div class="user-profile">
          <img class="avatar" src="imagy.jpg" />
          <span class="username">@meu_perfil</span>
        </div>
        <div class="caption">Minha segunda foto! 🔥</div>
      </div>

      <div class="actions-sidebar">
        <button class="action-btn like-btn">
          <i data-feather="heart"></i>
          <span class="action-count">0</span>
        </button>
        <button class="action-btn comment-btn">
          <i data-feather="message-circle"></i>
          <span class="action-count comment-count">0</span>
        </button>
        <button class="action-btn bookmark-btn">
          <i data-feather="bookmark"></i>
          <span class="action-count">0</span>
        </button>
      </div>

      <i data-feather="heart" class="pop-heart"></i>
    </div>

    <!-- POST 3 -->
    <div class="post" data-id="post_3">
      <div class="overlay-top"></div>
      <div class="overlay-bottom"></div>

      <div class="carousel">
        <div class="carousel-slide">
          <img src="cleit.jpg" alt="Foto 3" />
        </div>
      </div>

      <div class="post-info">
        <div class="user-profile">
          <img class="avatar" src="imagy.jpg" />
          <span class="username">@meu_perfil</span>
        </div>
        <div class="caption">Minha terceira foto 🚀</div>
      </div>

      <div class="actions-sidebar">
        <button class="action-btn like-btn">
          <i data-feather="heart"></i>
          <span class="action-count">0</span>
        </button>
        <button class="action-btn comment-btn">
          <i data-feather="message-circle"></i>
          <span class="action-count comment-count">0</span>
        </button>
        <button class="action-btn bookmark-btn">
          <i data-feather="bookmark"></i>
          <span class="action-count">0</span>
        </button>
      </div>

      <i data-feather="heart" class="pop-heart"></i>
    </div>

  </div>

  <!-- Comments Bottom Drawer -->
  <div class="comments-drawer" id="commentsDrawer">
    <div class="comments-backdrop" id="commentsBackdrop"></div>
    <div class="comments-sheet">
      <div class="sheet-header">
        <span class="sheet-title">Comentários (<span id="drawerCommentCount">0</span>)</span>
        <button class="close-btn" id="closeDrawerBtn">&times;</button>
      </div>

      <div class="comments-list" id="commentsList"></div>

      <div class="sheet-footer">
        <div class="user-indicator">
          <span>Comentando como: <strong id="displayName">Visitante</strong></span>
          <button class="change-name-link" id="changeNameBtn">Mudar nome</button>
        </div>
        <span class="chips-label">Toque para comentar:</span>
        <div class="premade-chips">
          <button class="chip-btn" data-text="Legal 👍">Legal 👍</button>
          <button class="chip-btn" data-text="Chato 👎">Chato 👎</button>
          <button class="chip-btn" data-text="Incrível 🔥">Incrível 🔥</button>
          <button class="chip-btn" data-text="Amei! ❤️">Amei! ❤️</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Name Input Modal -->
  <div class="name-modal-overlay" id="nameModal">
    <div class="name-box">
      <h3>Qual é o seu nome?</h3>
      <p>Digite seu nome para enviar comentários nos posts.</p>
      <input type="text" id="nameInputField" placeholder="Seu nome..." maxlength="20" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelNameBtn">Cancelar</button>
        <button class="btn-confirm" id="saveNameBtn">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    feather.replace();

    // 1. Firebase Initialization with your config
    const firebaseConfig = {
      apiKey: "AIzaSyBFd_h_6JmUz2BKHjoK4K73uGSlzjNa5K0",
      authDomain: "teste-a1cdc.firebaseapp.com",
      databaseURL: "https://teste-a1cdc-default-rtdb.firebaseio.com",
      projectId: "teste-a1cdc",
      storageBucket: "teste-a1cdc.firebasestorage.app",
      messagingSenderId: "672456864375",
      appId: "1:672456864375:web:99f686cdd028757f7e0c72"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Ambient background for images
    function initSlideAmbientBackgrounds() {
      document.querySelectorAll('.carousel-slide').forEach(slide => {
        const img = slide.querySelector('img');
        if (img && !slide.querySelector('.slide-bg-blur')) {
          const bg = document.createElement('div');
          bg.className = 'slide-bg-blur';
          const applyBg = () => {
            bg.style.backgroundImage = `url("${img.currentSrc || img.src}")`;
          };
          if (img.complete) {
            applyBg();
          } else {
            img.addEventListener('load', applyBg);
          }
          slide.insertBefore(bg, img);
        }
      });
    }
    initSlideAmbientBackgrounds();

    // Local user identity & local likes tracking
    let currentActivePostId = null;
    let pendingCommentText = null;

    function getStoredUsername() {
      return localStorage.getItem('reels_user_name') || '';
    }

    function setStoredUsername(name) {
      localStorage.setItem('reels_user_name', name.trim());
      updateNameDisplay();
    }

    function updateNameDisplay() {
      const name = getStoredUsername();
      document.getElementById('displayName').textContent = name ? `@${name}` : 'Visitante';
    }
    updateNameDisplay();

    function hasUserLikedLocally(postId) {
      return localStorage.getItem('liked_' + postId) === 'true';
    }

    function setUserLikedLocally(postId, isLiked) {
      localStorage.setItem('liked_' + postId, isLiked ? 'true' : 'false');
    }

    // 3. Realtime Database Listeners
    document.querySelectorAll('.post').forEach(post => {
      const postId = post.dataset.id;
      const carousel = post.querySelector('.carousel');
      const slides = post.querySelectorAll('.carousel-slide');
      const dots = post.querySelectorAll('.indicator-dot');
      const badge = post.querySelector('.slide-badge');
      const likeBtn = post.querySelector('.like-btn');
      const commentBtn = post.querySelector('.comment-btn');
      const popHeart = post.querySelector('.pop-heart');

      // Initialize like button active state from localStorage
      if (hasUserLikedLocally(postId)) {
        likeBtn.classList.add('liked');
      }

      // Listen for live Likes & Comments from Firebase
      db.ref('posts/' + postId).on('value', snapshot => {
        const data = snapshot.val() || {};
        const likesCount = data.likes || 0;
        const commentsObj = data.comments || {};
        const commentsCount = Object.keys(commentsObj).length;

        likeBtn.querySelector('.action-count').textContent = likesCount;
        post.querySelector('.comment-count').textContent = commentsCount;

        // If this post is currently open in drawer, update comments live
        if (currentActivePostId === postId) {
          renderCommentsFromData(commentsObj);
        }
      });

      // Carousel horizontal scroll
      carousel.addEventListener('scroll', () => {
        const slideWidth = carousel.clientWidth;
        const currentIndex = Math.round(carousel.scrollLeft / slideWidth);
        if (badge) badge.textContent = `${currentIndex + 1}/${slides.length}`;
        dots.forEach((dot, index) => {
          dot.classList.toggle('active', index === currentIndex);
        });
      });

      // Like Button Click -> updates Firebase atomically
      likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFirebaseLike(postId, likeBtn);
      });

      // Double tap to like
      let lastTap = 0;
      carousel.addEventListener('pointerdown', () => {
        const now = Date.now();
        if (now - lastTap < 300) {
          if (!hasUserLikedLocally(postId)) {
            toggleFirebaseLike(postId, likeBtn);
          }
          popHeart.classList.remove('animate');
          void popHeart.offsetWidth;
          popHeart.classList.add('animate');
          setTimeout(() => popHeart.classList.remove('animate'), 700);
        }
        lastTap = now;
      });

      // Open Comments Drawer
      commentBtn.addEventListener('click', () => {
        openCommentsDrawer(postId);
      });
    });

    function toggleFirebaseLike(postId, likeBtn) {
      const alreadyLiked = hasUserLikedLocally(postId);
      const postRef = db.ref('posts/' + postId + '/likes');

      if (!alreadyLiked) {
        postRef.transaction(current => (current || 0) + 1);
        setUserLikedLocally(postId, true);
        likeBtn.classList.add('liked');
      } else {
        postRef.transaction(current => Math.max((current || 0) - 1, 0));
        setUserLikedLocally(postId, false);
        likeBtn.classList.remove('liked');
      }
    }

    // 4. Comments Drawer Logic
    const drawer = document.getElementById('commentsDrawer');
    const commentsList = document.getElementById('commentsList');
    const drawerCommentCount = document.getElementById('drawerCommentCount');

    function openCommentsDrawer(postId) {
      currentActivePostId = postId;
      db.ref('posts/' + postId + '/comments').once('value', snapshot => {
        renderCommentsFromData(snapshot.val() || {});
      });
      drawer.classList.add('open');
    }

    function closeCommentsDrawer() {
      drawer.classList.remove('open');
      currentActivePostId = null;
    }

    document.getElementById('closeDrawerBtn').addEventListener('click', closeCommentsDrawer);
    document.getElementById('commentsBackdrop').addEventListener('click', closeCommentsDrawer);

    function renderCommentsFromData(commentsObj) {
      const commentsArray = Object.values(commentsObj);
      drawerCommentCount.textContent = commentsArray.length;

      if (commentsArray.length === 0) {
        commentsList.innerHTML = `<div class="empty-state">Nenhum comentário ainda.<br>Seja o primeiro a reagir!</div>`;
        return;
      }

      commentsList.innerHTML = commentsArray
        .map(c => `
          <div class="comment-item">
            <div>
              <strong>${escapeHtml(c.user)}</strong>
              <span class="comment-text">${escapeHtml(c.text)}</span>
            </div>
          </div>
        `)
        .join('');

      commentsList.scrollTop = commentsList.scrollHeight;
    }

    // Pre-made comment button click
    document.querySelectorAll('.chip-btn').forEach(button => {
      button.addEventListener('click', () => {
        const commentText = button.dataset.text;
        const username = getStoredUsername();

        if (!username) {
          pendingCommentText = commentText;
          openNameModal();
        } else {
          sendCommentToFirebase(username, commentText);
        }
      });
    });

    function sendCommentToFirebase(username, text) {
      if (!currentActivePostId) return;
      db.ref('posts/' + currentActivePostId + '/comments').push({
        user: `@${username}`,
        text: text,
        timestamp: Date.now()
      });
    }

    // 5. Name Modal Logic
    const nameModal = document.getElementById('nameModal');
    const nameInput = document.getElementById('nameInputField');

    function openNameModal() {
      nameInput.value = getStoredUsername();
      nameModal.classList.add('open');
      setTimeout(() => nameInput.focus(), 50);
    }

    function closeNameModal() {
      nameModal.classList.remove('open');
      pendingCommentText = null;
    }

    document.getElementById('changeNameBtn').addEventListener('click', openNameModal);
    document.getElementById('cancelNameBtn').addEventListener('click', closeNameModal);

    document.getElementById('saveNameBtn').addEventListener('click', () => {
      const val = nameInput.value.trim().replace(/^@/, '');
      if (!val) {
        alert('Por favor, informe um nome.');
        return;
      }
      setStoredUsername(val);
      nameModal.classList.remove('open');

      if (pendingCommentText) {
        sendCommentToFirebase(val, pendingCommentText);
        pendingCommentText = null;
      }
    });

    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('saveNameBtn').click();
      }
    });

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function (s) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[s];
      });
    }
  </script>
</body>
</html>
